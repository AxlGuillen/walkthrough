<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Charts: bar, line, donut, stat and compare. Everything comes from `data` in the tour; Node
     validates it and lays out the scene (src/charts/), which this page paints and animates.
     Beats: p0, p1… for the points of a series (from each `at`; Node spreads the rest between
     them), value for a donut or a stat,
     before and after for a comparison. -->
<link rel="stylesheet" href="base.css">
<style>
  body.full { background: var(--stage); }
  .abs { position: absolute; box-sizing: border-box; }
  .t { position: absolute; translate: -50% -50%; white-space: nowrap; line-height: 1; }
  .title { translate: none; font-weight: 800; letter-spacing: -0.02em; }
  .tick { translate: -100% -50%; color: var(--muted); font-variant-numeric: tabular-nums; }
  .label { color: var(--muted); font-weight: 600; }
  .value { font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .change { padding: 0.35em 0.8em; border-radius: 99em; background: var(--accent); color: var(--on-accent); font-weight: 800; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .grid { stroke: var(--line); stroke-width: 1; }
  .bar { fill: color-mix(in srgb, var(--ink) 30%, transparent); }
  .bar.lead, .solo .bar { fill: var(--accent); }
  .stroke { fill: none; stroke: var(--accent); stroke-linecap: round; stroke-linejoin: round; }
  .area { fill: color-mix(in srgb, var(--accent) 16%, transparent); }
  .dot { fill: var(--accent); stroke: var(--ink); }
  .track { fill: none; stroke: var(--line); }
  .arrow { fill: none; stroke: var(--stroke); stroke-linecap: round; }
  .emoji { position: absolute; translate: -50% -50%; object-fit: contain; }
</style>
</head>
<body>
<svg id="art"></svg>
<script src="params.js"></script>
<script src="vendor/gsap/gsap.min.js"></script>
<script src="vendor/gsap/SplitText.min.js"></script>
<script src="vendor/gsap/DrawSVGPlugin.min.js"></script>
<script src="kit.js"></script>
<script>
  const scene = JSON.parse(new URLSearchParams(location.search).get('scene') ?? 'null');
  const svg = document.getElementById('art');
  const NS = 'http://www.w3.org/2000/svg';
  const px = n => `${n}px`;
  const tl = kit.timeline();
  let cued = false;
  const cue = at => { if (!cued) walkthrough.cue(at); cued = true; };
  const at = (name, fallback) => kit.beat(name, fallback);
  document.body.classList.add(scene.mode);

  function text({ text: content, x, y, size }, className) {
    const el = document.createElement('div');
    el.className = `t ${className}`;
    Object.assign(el.style, { left: px(x), top: px(y), fontSize: px(size) });
    el.textContent = content;
    document.body.append(el);
    return el;
  }
  function shape(tag, attrs, className) {
    const el = document.createElementNS(NS, tag);
    for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
    if (className) el.setAttribute('class', className);
    svg.append(el);
    return el;
  }
  // An emoji that pops in on its beat with a little overshoot.
  function emoji(spec, start) {
    if (!spec) return;
    const img = document.createElement('img');
    img.className = 'emoji';
    img.alt = '';
    img.src = walkthrough.emoji(spec.name);
    Object.assign(img.style, { left: px(spec.x), top: px(spec.y), width: px(spec.size), height: px(spec.size) });
    document.body.append(img);
    tl.fromTo(img, { opacity: 0, scale: 0.4, rotation: -12 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.6, ease: 'back.out(2.2)' }, start);
  }
  // A number that counts from its start to the value Node formatted, on the chart's beat.
  function counting(el, count, start, duration = 1) {
    tl.add(kit.count(el, { from: count.from, to: count.to, decimals: count.decimals, prefix: count.prefix, suffix: count.suffix, duration }), start);
  }

  if (scene.panel) {
    const panel = document.createElement('div');
    panel.className = 'abs panel';
    Object.assign(panel.style, { left: px(scene.panel.x), top: px(scene.panel.y), width: px(scene.panel.width), height: px(scene.panel.height) });
    document.body.prepend(panel);
    tl.fromTo(panel, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5 }, 0);
  }
  if (scene.title) {
    const title = text({ ...scene.title, y: scene.title.y }, 'title');
    title.style.translate = 'none';
    tl.fromTo(title, { opacity: 0, y: '0.4em' }, { opacity: 1, y: 0 }, 0.1);
    cue(0.1);
  }
  if (scene.grid) {
    const lines = scene.grid.map(tick => shape('line', { x1: scene.plot.x, x2: scene.plot.x + scene.plot.width, y1: tick.y, y2: tick.y }, 'grid'));
    const ticks = scene.grid.map(tick => text(tick, 'tick'));
    tl.fromTo([...lines, ...ticks], { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.03 }, 0.2);
  }

  const draw = {
    bar() {
      if (!scene.bars.some(bar => bar.highlight)) document.body.classList.add('solo');
      scene.bars.forEach((bar, i) => {
        const start = bar.time;
        const rect = shape('rect', { x: bar.rect.x, y: bar.rect.y, width: bar.rect.width, height: Math.max(0, bar.rect.height), rx: Math.min(bar.rect.width * 0.12, 10) }, `bar${bar.highlight ? ' lead' : ''}`);
        const label = text(bar.label, 'label');
        const value = text(bar.value, 'value');
        // Grown through its own geometry from the baseline, and its value rides the top.
        const base = bar.rect.y + bar.rect.height;
        tl.fromTo(rect, { attr: { y: base, height: 0 } }, { attr: { y: bar.rect.y, height: Math.max(0, bar.rect.height) }, duration: 0.7, ease: 'power3.out' }, start);
        tl.fromTo(value, { top: px(base - (bar.rect.y - bar.value.y)) }, { top: px(bar.value.y), duration: 0.7, ease: 'power3.out' }, start);
        tl.fromTo([label, value], { opacity: 0 }, { opacity: 1, duration: 0.3 }, start);
        counting(value, bar.count, start, 0.7);
      });
    },
    line() {
      const times = scene.points.map(point => point.time);
      const area = shape('path', { d: scene.area }, 'area');
      const stroke = shape('path', { d: scene.line, 'stroke-width': scene.u * 0.5 }, 'stroke');
      tl.set(stroke, { drawSVG: '0% 0%' }, 0);
      tl.fromTo(area, { opacity: 0 }, { opacity: 1, duration: 0.6 }, times.at(-1));
      scene.points.forEach((point, i) => {
        const start = times[i];
        if (i > 0) {
          const span = Math.min(0.6, Math.max(0.1, start - times[i - 1]));
          tl.to(stroke, { drawSVG: `0% ${point.fraction * 100}%`, duration: span, ease: 'none' }, start - span);
        }
        const dot = shape('circle', { cx: point.x, cy: point.y, r: scene.u * 0.9, 'stroke-width': scene.u * 0.3 }, 'dot');
        const label = text(point.label, 'label');
        const value = text(point.value, 'value');
        tl.fromTo(dot, { scale: 0, transformOrigin: '50% 50%' }, { scale: 1, duration: 0.4, ease: kit.ease.pop }, start);
        tl.fromTo([label, value], { opacity: 0 }, { opacity: 1, duration: 0.3 }, start);
        counting(value, point.count, start, 0.6);
      });
    },
    donut() {
      const start = at('value', 0.5);
      cue(start);
      const { x, y } = scene.center;
      shape('circle', { cx: x, cy: y, r: scene.radius, 'stroke-width': scene.width }, 'track');
      const arc = shape('circle', { cx: x, cy: y, r: scene.radius, 'stroke-width': scene.width, transform: `rotate(-90 ${x} ${y})` }, 'stroke');
      const value = text(scene.value, 'value');
      const label = text(scene.label, 'label');
      tl.fromTo(arc, { drawSVG: '0%' }, { drawSVG: `${scene.fraction * 100}%`, duration: 1.2, ease: kit.ease.inOut }, start);
      tl.fromTo([value, label], { opacity: 0 }, { opacity: 1, duration: 0.3 }, start);
      counting(value, scene.count, start, 1.2);
    },
    stat() {
      const start = at('value', 0.4);
      cue(start);
      const value = text(scene.value, 'value');
      const label = text(scene.label, 'label');
      tl.fromTo(value, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5 }, start);
      counting(value, scene.count, start, 1.4);
      tl.fromTo(label, { opacity: 0, y: '0.5em' }, { opacity: 1, y: 0 }, start + 0.3);
      emoji(scene.emoji, start + 1.2);
    },
    compare() {
      const first = at('before', 0.4);
      const second = at('after', first + 1.3);
      cue(first);
      for (const [side, start] of [[scene.before, first], [scene.after, second]]) {
        const label = text(side.label, 'label');
        const value = text(side.value, 'value');
        tl.fromTo([label, value], { opacity: 0, y: '0.3em' }, { opacity: 1, y: 0, duration: 0.5 }, start);
        counting(value, side.count, start, 0.9);
      }
      const arrow = shape('path', { d: scene.arrow, 'stroke-width': scene.u * 0.5 }, 'arrow');
      tl.add(kit.draw(arrow, { duration: 0.5 }), second - 0.5);
      if (scene.change.text) {
        const change = text(scene.change, 'change');
        tl.fromTo(change, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: kit.ease.pop }, second + 0.9);
      }
      emoji(scene.emoji, second + 1.1);
    },
  };
  draw[scene.type]();
</script>
</body>
</html>
