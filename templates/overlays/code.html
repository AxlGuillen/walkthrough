<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Code: an editor, a terminal or a diff. Node validates `data`, highlights the syntax and lays
     out the scene (src/code/), which this page paints and animates. Beats: start (when the
     code begins to appear), r0, r1… (a terminal's commands) and h0, h1… (each highlight). -->
<link rel="stylesheet" href="base.css">
<style>
  :root { --win: #0f1115; --winbar: #171a21; --ln: #4b5263;
    --k-keyword: #c678dd; --k-string: #98c379; --k-number: #d19a66; --k-comment: #7f848e; --k-function: #61afef; --k-type: #e5c07b;
    --k-property: #e06c75; --k-tag: #e06c75; --k-attr: #d19a66; --k-variable: #56b6c2; --k-operator: #56b6c2; --k-punct: #abb2bf; --k-plain: #d7dae0;
    --add: rgba(46, 160, 67, 0.2); --add-ink: #56d364; --del: rgba(248, 81, 73, 0.18); --del-ink: #ff7b72; }
  :root[data-theme="light"] { --win: #ffffff; --winbar: #f2f2ef; --ln: #a0a4ab;
    --k-keyword: #cf222e; --k-string: #0a3069; --k-number: #0550ae; --k-comment: #6e7781; --k-function: #8250df; --k-type: #953800;
    --k-property: #0550ae; --k-tag: #116329; --k-attr: #0550ae; --k-variable: #953800; --k-operator: #cf222e; --k-punct: #24292f; --k-plain: #24292f;
    --add: rgba(46, 160, 67, 0.14); --add-ink: #1a7f37; --del: rgba(248, 81, 73, 0.12); --del-ink: #cf222e; }
  body.full { background: var(--stage); }
  .abs { position: absolute; box-sizing: border-box; }
  .window { background: var(--win); border-radius: 1.6vmin; overflow: hidden;
    box-shadow: 0 2.4vmin 6vmin var(--shadow), inset 0 0 0 1px var(--line); }
  .bar { position: relative; display: flex; align-items: center; gap: 1vmin; padding: 0 2vmin; background: var(--winbar); box-shadow: inset 0 -1px 0 var(--line); }
  .dot { width: 1.3vmin; height: 1.3vmin; border-radius: 50%; background: var(--ln); opacity: 0.7; }
  .label { margin-left: 1.4vmin; font: 600 1.9vmin var(--mono); color: var(--muted); white-space: nowrap; }
  .body { overflow: hidden; }
  .code { position: absolute; left: 0; top: 0; width: 100%; transform-origin: 0 0; }
  .row { position: absolute; left: 0; right: 0; font-family: var(--mono); white-space: pre; }
  .num { position: absolute; left: 0; text-align: right; color: var(--ln); font-variant-numeric: tabular-nums; }
  .text { position: absolute; display: inline-block; color: var(--k-plain); }
  .row.add { background: var(--add); } .row.del { background: var(--del); }
  .row.add .mark { color: var(--add-ink); } .row.del .mark { color: var(--del-ink); }
  .mark { position: absolute; font-weight: 700; }
  .prompt { position: absolute; color: var(--accent-ink); font-weight: 700; }
  .row.output .text { color: var(--muted); }
  .band { position: absolute; left: 0; right: 0; background: color-mix(in srgb, var(--accent) 18%, transparent);
    box-shadow: inset 0.5vmin 0 0 var(--accent); opacity: 0; }
  /* A highlight's note sits in the title bar, where it always fits, whatever the line length. */
  .note { position: absolute; right: 2vmin; top: 50%; translate: 0 -50%; padding: 0.35em 0.9em; border-radius: 99em;
    background: var(--accent); color: var(--on-accent); font: 700 1.9vmin var(--font); white-space: nowrap; opacity: 0; }
  .caret { position: absolute; background: var(--accent); opacity: 0; font-family: var(--mono); }

  .keyword { color: var(--k-keyword); } .string { color: var(--k-string); } .number { color: var(--k-number); }
  .comment { color: var(--k-comment); font-style: italic; } .function { color: var(--k-function); } .type { color: var(--k-type); }
  .property { color: var(--k-property); } .tag { color: var(--k-tag); } .attr { color: var(--k-attr); } .variable { color: var(--k-variable); }
  .operator { color: var(--k-operator); } .punct { color: var(--k-punct); }
</style>
</head>
<body>
<script src="params.js"></script>
<script src="vendor/gsap/gsap.min.js"></script>
<script src="vendor/gsap/SplitText.min.js"></script>
<script src="kit.js"></script>
<script>
  const scene = JSON.parse(new URLSearchParams(location.search).get('scene') ?? 'null');
  const px = n => `${n}px`;
  const tl = kit.timeline();
  document.body.classList.add(scene.mode);
  const el = (className, parent = document.body, tag = 'div') => {
    const node = document.createElement(tag);
    node.className = className;
    parent.append(node);
    return node;
  };
  const place = (node, { x, y, width, height }) => Object.assign(node.style, { left: px(x), top: px(y), width: px(width), height: px(height) });

  const win = el('abs window');
  place(win, scene.window);
  const bar = el('bar', win);
  bar.style.height = px(scene.bar);
  for (let i = 0; i < 3; i++) el('dot', bar);
  el('label', bar).textContent = scene.label;
  tl.fromTo(win, { opacity: 0, y: 30, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.5 }, 0.1);
  walkthrough.cue(0.1);

  const body = el('abs body');
  place(body, scene.body);
  const code = el('code', body);
  code.style.height = px(scene.lines.length * scene.line);
  const { font, line, gutter } = scene;
  const offset = gutter + (scene.view === 'diff' ? 2 : scene.view === 'terminal' ? 2 : 0) * font * 0.62;

  // Each line: number, diff mark or prompt, then the highlighted text.
  const rows = scene.lines.map((spec, i) => {
    const row = el(`row ${spec.kind}`, code);
    Object.assign(row.style, { top: px(i * line), height: px(line), lineHeight: px(line), fontSize: px(font) });
    if (spec.number !== null) {
      const num = el('num', row);
      Object.assign(num.style, { width: px(gutter - font), lineHeight: px(line) });
      num.textContent = String(spec.number);
    }
    if (scene.view === 'diff' && spec.kind !== 'code') {
      const mark = el('mark', row);
      mark.style.left = px(gutter);
      mark.textContent = spec.kind === 'add' ? '+' : '−';
    }
    if (spec.kind === 'command') {
      const prompt = el('prompt', row);
      prompt.style.left = px(gutter);
      prompt.textContent = '$';
    }
    const text = el('text', row);
    text.style.left = px(offset);
    for (const token of spec.tokens) el(token.kind === 'plain' ? '' : token.kind, text, 'span').textContent = token.text;
    return { row, text, spec };
  });

  // Typed lines are cut to the characters written so far; `ch` is one character of the
  // monospace font, so the cut is exact on every frame.
  const typed = rows.filter(r => r.spec.cps);
  const caret = el('caret', code);
  Object.assign(caret.style, { width: px(font * 0.12), height: px(font * 1.15) });
  if (typed.length) {
    walkthrough.timeline(t => {
      let active = null;
      for (const { row, text, spec } of typed) {
        const shown = Math.max(0, Math.min(spec.chars, Math.floor((t - spec.start) * spec.cps)));
        text.style.clipPath = `inset(0 ${spec.chars - shown}ch 0 0)`;
        row.style.visibility = t >= spec.start ? 'visible' : 'hidden';
        if (t >= spec.start) active = { row, spec, shown };
      }
      if (!active) return caret.style.opacity = '0';
      const typing = active.shown < active.spec.chars;
      const top = parseFloat(active.row.style.top);
      Object.assign(caret.style, { left: `calc(${px(offset)} + ${active.shown}ch)`, top: px(top + (line - font * 1.15) / 2), fontSize: px(font) });
      caret.style.opacity = typing || Math.floor(t * 2) % 2 === 0 ? '1' : '0';
    });
  }
  for (const { row, spec } of rows) {
    if (spec.cps) continue;
    if (scene.view === 'terminal' || scene.reveal === 'lines') tl.fromTo(row, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.35 }, spec.start);
  }

  // Highlights: a band on their lines, the rest dimmed, a note beside them, and a zoom when
  // the code is long. Each one holds until the next takes over.
  const zoomTo = (focus, at) => {
    const height = scene.body.height;
    const y = Math.min(0, Math.max(height - scene.lines.length * line * focus.scale, height / 2 - focus.y * focus.scale));
    tl.to(code, { scale: focus.scale, y: focus.scale === 1 ? 0 : y, duration: 0.7, ease: kit.ease.inOut }, at);
  };
  scene.highlights.forEach((h, i) => {
    const bands = h.lines.map(n => {
      const band = el('band', code);
      Object.assign(band.style, { top: px(n * line), height: px(line) });
      code.insertBefore(band, code.firstChild);
      return band;
    });
    const lit = new Set(h.lines);
    tl.to(bands, { opacity: 1, duration: 0.35 }, h.time);
    tl.to(rows.filter((_, n) => !lit.has(n)).map(r => r.text), { opacity: 0.4, duration: 0.35 }, h.time);
    tl.to(rows.filter((_, n) => lit.has(n)).map(r => r.text), { opacity: 1, duration: 0.35 }, h.time);
    if (h.focus.scale !== 1) zoomTo(h.focus, h.time);
    if (h.note) {
      const note = el('note', bar);
      note.textContent = h.note;
      tl.fromTo(note, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: kit.ease.pop }, h.time + 0.15);
      const next = scene.highlights[i + 1];
      if (next) tl.to(note, { opacity: 0, duration: 0.25 }, next.time);
    }
    const next = scene.highlights[i + 1];
    if (next) tl.to(bands, { opacity: 0, duration: 0.3 }, next.time);
  });
</script>
</body>
</html>
