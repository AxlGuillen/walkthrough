<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- A sticker: an emoji with a short word that pops in to underline a moment ("🎉 Listo").
     params: emoji (required), text, position (top-right by default, top-left, bottom-right,
     bottom-left, center). beats: in (when it appears; 0.2s by default). -->
<link rel="stylesheet" href="base.css">
<style>
  .sticker { position: absolute; display: flex; align-items: center; gap: 1.6vmin; padding: 1.4vmin 2.6vmin 1.4vmin 1.6vmin; border-radius: 99vmin; }
  .sticker.solo { padding: 1.4vmin; }
  .sticker img { width: 8vmin; height: 8vmin; object-fit: contain; }
  .sticker .text { font-size: 3.2vmin; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; }
  .top-right { top: 5vmin; right: 5vmin; } .top-left { top: 5vmin; left: 5vmin; }
  .bottom-right { bottom: 5vmin; right: 5vmin; } .bottom-left { bottom: 5vmin; left: 5vmin; }
  .center { left: 50%; top: 50%; translate: -50% -50%; }
  .center img { width: 14vmin; height: 14vmin; }
  @media (orientation: portrait) { .bottom-right, .bottom-left { bottom: 14vh; } }
</style>
</head>
<body>
<div class="sticker panel"><img alt=""><span class="text" data-param="text"></span></div>
<script src="params.js"></script>
<script src="vendor/gsap/gsap.min.js"></script>
<script src="vendor/gsap/SplitText.min.js"></script>
<script src="kit.js"></script>
<script>
  const sticker = document.querySelector('.sticker');
  const position = ['top-right', 'top-left', 'bottom-right', 'bottom-left', 'center'].includes(param('position')) ? param('position') : 'top-right';
  sticker.classList.add(position);
  if (!param('text')) sticker.classList.add('solo');
  const img = sticker.querySelector('img');
  img.src = walkthrough.emoji(param('emoji'));
  const tl = kit.timeline();
  const start = kit.beat('in', 0.2);
  const end = Math.max(start + 1, walkthrough.duration - 0.45);
  tl.fromTo(sticker, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.55, ease: 'back.out(2)' }, start);
  walkthrough.cue(start);
  tl.fromTo(img, { rotation: -18 }, { rotation: 0, duration: 0.9, ease: 'elastic.out(1, 0.45)' }, start);
  // A slow bob while it stays, finite so the timeline has a known end.
  const bobs = Math.max(0, Math.floor((end - start - 0.6) / 1.2));
  if (bobs) tl.to(img, { y: '-0.8vmin', duration: 0.6, ease: 'sine.inOut', yoyo: true, repeat: bobs * 2 - 1 }, start + 0.6);
  tl.to(sticker, { opacity: 0, scale: 0.85, duration: 0.35, ease: kit.ease.exit }, end);
</script>
</body>
</html>
