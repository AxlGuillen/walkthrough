<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 40px; background: #000; color: #eee; font: 16px sans-serif; }
  #card { width: 280px; padding: 20px; border-radius: 12px; background: #808080; transition: background 300ms linear; }
  #card:hover { background: #0000ff; }
  #toggle { margin-top: 24px; padding: 10px 16px; border: 0; background: #ff0000; }
  #toggle.done { background: #00ff00; color: black; }
  #name { display: block; margin-top: 24px; }
</style>
</head>
<body>
  <div id="card">UWS-142 · Estimado 3h</div>
  <button id="toggle" onclick="this.classList.add('done'); this.textContent = 'Listo'">Terminar</button>
  <input id="name" placeholder="Nombre">
  <div id="row" style="margin-top: 24px; width: 1200px; padding: 8px 0">Fila</div>
</body>
</html>
