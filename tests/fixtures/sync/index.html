<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  body { margin: 0; width: 1600px; height: 900px; background: #fff; overflow: hidden; }
  /* A plain button to mark and click, and patterned corners that show when the camera moves. */
  #target { position: absolute; left: 650px; top: 390px; width: 300px; height: 120px; border: 0; background: #888; color: #fff; font: 28px sans-serif; }
  .corner { position: absolute; width: 200px; height: 200px; background: repeating-linear-gradient(45deg, #222 0 12px, #ddd 12px 24px); }
</style>
</head>
<body>
  <div class="corner" style="left:0;top:0"></div>
  <div class="corner" style="right:0;top:0"></div>
  <div class="corner" style="left:0;bottom:0"></div>
  <div class="corner" style="right:0;bottom:0"></div>
  <button id="target">Target</button>
</body>
</html>
