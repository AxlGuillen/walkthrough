<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
  <!-- Like Studio's "Replace": a button opens the system file picker, and the page reads what was chosen. -->
  <button id="replace" onclick="document.getElementById('file').click()">Replace</button>
  <input id="file" type="file" hidden>
  <p id="chosen"></p>
  <script>
    document.getElementById('file').addEventListener('change', async event => {
      const [file] = event.target.files;
      const chosen = document.getElementById('chosen');
      chosen.textContent = `${file.name}: ${(await file.text()).trim()}`;
      chosen.className = 'done';
    });
  </script>
</body>
</html>
