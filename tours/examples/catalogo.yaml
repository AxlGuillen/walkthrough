title: Catálogo de recursos
url: about:blank
accent: "#C8633A"
# Un ejemplo de cada recurso, sin voz: los beats van en segundos desde el inicio de cada
# segmento. Lo renderiza `walkthrough catalog` en 16:9 y 9:16, y una prueba comprueba que
# cada entrada sea válida y quepa en los dos formatos. Al agregar un recurso o una variante,
# agrega aquí su ejemplo. Los ejemplos narrados están en aperturas, graficas, codigo y flujos.
segments:
  # Aperturas, capítulo y cierre
  - hold: 5
    overlays:
      - src: opening.html
        params: { style: kinetic, eyebrow: UrVenue · Resort microsite, title: Sunset Shores, subtitle: Un recorrido guiado }
        beats: { title: 0.4, subtitle: 1.1 }
  - hold: 5.5
    overlays:
      - src: opening.html
        params: { style: over-app, eyebrow: UrVenue · Resort microsite, title: Sunset Shores, subtitle: Un recorrido guiado }
        beats: { title: 0.4, reveal: 1.8 }
  - hold: 5
    overlays:
      - src: opening.html
        params: { style: brand, eyebrow: UrVenue · Resort microsite, title: Sunset Shores, subtitle: Un recorrido guiado }
        beats: { mark: 0.3, title: 1.1 }
  - hold: 3
    overlays:
      - src: chapter-card.html
        params: { style: kinetic, eyebrow: Capítulo, index: 2, total: 5, title: Reservas }
  - hold: 4
    overlays:
      - src: closing.html
        params: { style: kinetic, title: Gracias, subtitle: Resort microsite en UrVenue, url: sunsetshores.urresort.com }

  # Gráficas
  - hold: 4.5
    overlays:
      - src: chart.html
        data:
          type: bar
          title: Reservas por día
          highlight: Sáb
          series: [{ label: Lun, value: 42 }, { label: Mar, value: 38 }, { label: Mié, value: 55 }, { label: Jue, value: 71 }, { label: Vie, value: 128 }, { label: Sáb, value: 163 }, { label: Dom, value: 97 }]
  - hold: 4.5
    overlays:
      - src: chart.html
        data:
          type: line
          title: Commits por semana
          series: [{ label: S1, value: 12 }, { label: S2, value: 18 }, { label: S3, value: 9 }, { label: S4, value: 26 }, { label: S5, value: 31 }, { label: S6, value: 79 }, { label: S7, value: 44 }]
  - hold: 4
    overlays:
      - src: chart.html
        data: { type: donut, label: De las mesas del sábado, value: 68, unit: "%" }
  - hold: 4
    overlays:
      - src: chart.html
        data: { type: stat, label: reservas este mes, value: 1284, emoji: party-popper }
  - hold: 5
    overlays:
      - src: chart.html
        data: { type: compare, title: Tiempo por cotización, unit: min, before: { label: Antes, value: 45 }, after: { label: Ahora, value: 3, at: 1.8 } }
  - hold: 4
    overlays:
      - src: chart.html
        data:
          type: bar
          mode: card
          title: Ocupación por venue
          unit: "%"
          series: [{ label: Vera, value: 82 }, { label: Pool, value: 64 }, { label: Spa, value: 71 }]

  # Código
  - hold: 5
    overlays:
      - src: code.html
        data:
          language: ts
          file: src/api/reservations.ts
          code: |
            export async function reserve(guest: Guest, table: Table) {
              const taken = await db.count('reservations', table.id);
              if (taken >= table.capacity) {
                throw new Error('This table is full');
              }
              return db.insert('reservations', { guest, table });
            }
          highlight:
            - { lines: "2-5", at: 1.8, note: Revisa el cupo }
            - { lines: 6, at: 3.2, note: Aparta la mesa }
  - hold: 6.5
    overlays:
      - src: code.html
        data:
          view: terminal
          code: |
            $ bun run walkthrough check demo.yaml
            ✓ 18 ok · 0 warnings · 0 failures
            $ bun run walkthrough render demo.yaml
            ✓ preview in 84.7s
  - hold: 4
    overlays:
      - src: code.html
        data:
          view: diff
          language: ts
          file: src/capture/scroll.ts
          code: |2
             function scrollDuration(distance: number) {
            -  return clamp(0.4 + distance / 2500, 0.45, 1.1);
            +  return clamp(0.35 + distance / 1200, 0.6, 3.2);
             }
          highlight:
            - { lines: 3, at: 1.5, note: "1,200 px/s como máximo" }

  # Tablas
  - hold: 5
    overlays:
      - src: table.html
        data:
          title: Antes y ahora
          columns: [Excel, Walkthrough]
          highlight: Walkthrough
          rows:
            - { label: Video narrado, values: [no, yes], emoji: microphone }
            - { label: Se actualiza solo, values: [no, yes], emoji: gear }
            - { label: Sigue la marca, values: [partial, yes], emoji: sparkles }
            - { label: Tiempo por demo, values: [3 h, 10 min], emoji: stopwatch }
  - hold: 4.5
    overlays:
      - src: table.html
        data:
          mode: card
          columns: [Básico, Pro, Equipo]
          highlight: Pro
          rows:
            - { label: Tours, values: [3, ∞, ∞] }
            - { label: Marca propia, values: [no, yes, yes] }
            - { label: Precio, values: [$0, $12, $24] }

  # Líneas de tiempo
  - hold: 6
    overlays:
      - src: roadmap.html
        data:
          title: Hacia la versión 2
          milestones:
            - { date: Ene, title: Primer tour, detail: Grabado a mano, emoji: rocket }
            - { date: Mar, title: Voz y subtítulos, detail: Narración sincronizada, emoji: microphone }
            - { date: Jun, title: Recursos animados, detail: "Gráficas, código y flujos", emoji: sparkles, status: now }
            - { date: Sep, title: Marcos y tablas, emoji: laptop, status: next }
            - { date: Dic, title: Galería pública, emoji: globe-with-meridians, status: next }
  - hold: 5
    overlays:
      - src: roadmap.html
        data:
          mode: card
          milestones:
            - { date: Semana 1, title: Diseño }
            - { date: Semana 2, title: Desarrollo, status: now }
            - { date: Semana 3, title: Pruebas, status: next }
            - { date: Semana 4, title: Entrega, status: next }

  # Escenas con profundidad
  - hold: 7
    overlays:
      - src: board.html
        data:
          title: Pendientes de la semana
          items:
            - { text: Nómina por corte, at: 1, done: 4.4 }
            - { text: Mi perfil y avatares, at: 2.2, done: 5.2 }
            - { text: Filtro Vencida, at: 3.4 }
  - hold: 6
    overlays:
      - src: board.html
        data:
          style: white
          title: Sprint 12
          items:
            - { text: Diseño de la cámara, at: 1, done: 4 }
            - { text: Transiciones, at: 2.2 }
            - { text: Escenas con fondo, at: 3.2 }
  - hold: 4.5
    overlays:
      - src: corkboard.html
        data:
          title: Ideas para la próxima entrega
          notes:
            - { text: Planos de cámara, emoji: sparkles }
            - { text: Transiciones, detail: push · flip · fly }
            - { text: Un pizarrón que se tacha }
            - { text: Notas en un corcho, emoji: pushpin }
            - { text: El marco como capa }

  # Aparte (sin el escenario: aquí solo el texto, en el sitio que deja la pantalla)
  - hold: 5
    overlays:
      - src: aside.html
        data:
          eyebrow: La cámara
          title: Cada cuadro se *coloca*, no se graba
          points:
            - { text: Una cámara virtual, emoji: eyes, at: 1.6 }
            - { text: Scroll preparado, emoji: sparkles, at: 2.2 }
            - { text: Marcas que siguen la página, emoji: pushpin, at: 2.8 }

  # Flujos
  - hold: 5
    flow:
      title: Cómo se reserva una mesa
      steps:
        - { text: Elige una noche, at: 0.5 }
        - { text: Escoge su mesa, detail: "Sección, capacidad y consumo mínimo", at: 1.3 }
        - { text: Paga el depósito, at: 2.1 }
        - { text: El host confirma, at: 2.9 }
  - hold: 5
    flow:
      shape: decision
      title: ¿Hay mesa disponible?
      steps: [{ text: Llega la solicitud, at: 0.5 }, { text: ¿Quedan mesas?, at: 1.3 }]
      branches:
        - { label: Sí, steps: [{ text: Se confirma, at: 2.1 }, { text: Se cobra el depósito, at: 2.9 }] }
        - { label: "No", steps: [{ text: Lista de espera, at: 3.8 }] }
  - hold: 5
    flow:
      shape: cycle
      title: Entrega semanal
      loop: 3.8
      steps: [{ text: Planear, at: 0.5 }, { text: Construir, at: 1.3 }, { text: Entregar, at: 2.1 }, { text: Escuchar feedback, at: 2.9 }]
  - hold: 5
    flow:
      shape: lanes
      title: ¿Quién hace qué?
      lanes: [Huésped, Venue, Host]
      steps:
        - { text: Elige su mesa, lane: Huésped, at: 0.5 }
        - { text: Aprueba la reserva, lane: Venue, at: 1.3 }
        - { text: Paga el depósito, lane: Huésped, at: 2.1 }
        - { text: Prepara la mesa, lane: Host, at: 2.9 }
  - hold: 5
    flow:
      shape: compare
      title: Reservar una mesa
      before: { label: Antes, steps: [{ text: Llamar al venue, at: 0.5 }, { text: Esperar respuesta, at: 1.3 }, { text: Mandar transferencia, at: 2.1 }] }
      after: { label: Ahora, steps: [{ text: Reservar en línea, at: 2.9 }, { text: Pagar con tarjeta, at: 3.7 }] }
  - hold: 4
    flow:
      mode: card
      title: Vida de un ticket
      steps: [{ text: Se crea, at: 0.5 }, { text: Se asigna, at: 1.3 }, { text: Se entrega, at: 2.1 }]

  # Emojis
  - hold: 5
    flow:
      title: Una entrega
      steps:
        - { text: Se planea, emoji: memo, at: 0.5 }
        - { text: Se construye, emoji: hammer-and-wrench, at: 1.3 }
        - { text: Se prueba, emoji: magnifying-glass-tilted-left, at: 2.1 }
        - { text: Se entrega, emoji: rocket, at: 2.9 }
  - hold: 3
    overlays:
      - src: sticker.html
        params: { emoji: check-mark-button, text: Listo, position: top-right }
  - hold: 3.5
    overlays:
      - src: chapter-card.html
        params: { style: kinetic, eyebrow: Capítulo, index: 3, total: 5, title: Reportes, emoji: bar-chart }

