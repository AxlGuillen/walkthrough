title: Catálogo de código
url: https://sunsetshores.urresort.com/
accent: "#C8633A"
# Muestra del recurso de código (docs/recursos.md): editor, terminal, diff, escritura y
# acercamiento. El código es de ejemplo. El sitio de fondo es público y aquí nada hace clic.
segments:
  - say: En el editor, el código aparece línea por línea. Primero revisa que la mesa tenga cupo, y si lo tiene, la aparta para el huésped.
    do:
      - goto: /
    overlays:
      - src: code.html
        data:
          language: ts
          file: src/api/reservations.ts
          code: |
            import { db } from '../db.ts';

            // Reserve a table for a guest, if the section still has room.
            export async function reserve(guest: Guest, table: Table) {
              const taken = await db.count('reservations', { table: table.id });
              if (taken >= table.capacity) {
                throw new Error('This table is full');
              }
              return db.insert('reservations', { guest: guest.id, table: table.id, status: 'held' });
            }
          highlight:
            - { lines: "5-8", at: cupo, note: Revisa el cupo }
            - { lines: 9, at: aparta, note: Aparta la mesa }

  - say: En la terminal, cada comando se escribe cuando lo nombras. Primero el check, que revisa el tour en segundos. Después el render, que genera la vista previa y revisa sus tiempos.
    overlays:
      - src: code.html
        data:
          view: terminal
          run: [check, render]
          code: |
            $ bun run walkthrough check tours/demo.yaml
            ✓ 18 ok · 0 warnings · 0 failures · 6.0s
            $ bun run walkthrough render tours/demo.yaml --preview
            ✓ preview in 84.7s
            ✓ timing: nothing off-beat

  - say: Un diff muestra qué cambió. La línea vieja se va, y la nueva limita el scroll a una velocidad que se puede leer.
    overlays:
      - src: code.html
        data:
          view: diff
          language: ts
          file: src/capture/scroll.ts
          code: |2
             export function scrollDuration(plans: readonly ScrollPlan[]): number {
            -  return Math.min(1.1, Math.max(0.45, 0.4 + distance / 2500));
            +  return Math.min(SCROLL.max, Math.max(SCROLL.min, 0.35 + distance / SCROLL.speed));
             }
          highlight:
            - { lines: 3, at: nueva, note: "1,200 px/s como máximo" }

  - say: El código también puede escribirse solo, como si alguien lo tecleara en ese momento.
    hold: 6.5
    overlays:
      - src: code.html
        data:
          language: yaml
          file: tours/demo.yaml
          reveal: type
          code: |
            - say: El huésped elige una noche y paga el depósito.
              flow:
                steps:
                  - { text: Elige una noche, at: noche }
                  - { text: Paga el depósito, at: depósito }

  - say: Y si el bloque es largo, la cámara se acerca a las líneas que importan, primero la validación y luego la respuesta.
    hold: 8
    overlays:
      - src: code.html
        data:
          language: ts
          file: src/api/checkout.ts
          code: |
            import { z } from 'zod';
            import { db } from '../db.ts';
            import { charge } from '../payments.ts';

            const body = z.object({
              stay: z.string(),
              items: z.array(z.string()).min(1),
              card: z.string(),
            });

            export async function checkout(request: Request) {
              const input = body.safeParse(await request.json());
              if (!input.success) {
                return Response.json({ error: input.error.issues }, { status: 400 });
              }
              const total = await db.total(input.data.items);
              const payment = await charge(input.data.card, total);
              await db.confirm(input.data.stay, payment.id);
              return Response.json({ ok: true, total });
            }
          highlight:
            - { lines: "12-15", at: validación, note: Valida el cuerpo }
            - { lines: 19, at: respuesta, note: Responde con el total }
