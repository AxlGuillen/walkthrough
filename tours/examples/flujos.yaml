title: Catálogo de flujos
url: about:blank
accent: "#7C5CFF"
# Muestra de las formas de flujo (docs/flujos.md). Sin app detrás: solo los flujos.
segments:
  - say: Así funciona una reserva. El huésped elige una noche, escoge su mesa, paga el depósito, y el host la confirma antes de que llegue.
    flow:
      title: Cómo se reserva una mesa
      steps:
        - { text: Elige una noche, at: noche }
        - { text: Escoge su mesa, detail: "Sección, capacidad y consumo mínimo", at: mesa }
        - { text: Paga el depósito, at: depósito }
        - { text: El host confirma, at: confirma }
  - say: En una tarjeta sobre la app, el flujo acompaña a lo que se ve. Se crea el ticket, se asigna, y se entrega.
    flow:
      mode: card
      title: Vida de un ticket
      steps:
        - { text: Se crea, at: crea }
        - { text: Se asigna, at: asigna }
        - { text: Se entrega, at: entrega }
  - say: Cuando llega una solicitud, el sistema revisa si quedan mesas. Si hay, se confirma y se cobra el depósito. Si no, el huésped entra a la lista de espera.
    flow:
      shape: decision
      title: ¿Hay mesa disponible?
      steps:
        - { text: Llega la solicitud, at: solicitud }
        - { text: ¿Quedan mesas?, at: quedan }
      branches:
        - label: Sí
          steps:
            - { text: Se confirma, at: confirma }
            - { text: Se cobra el depósito, at: depósito }
        - label: "No"
          steps:
            - { text: Lista de espera, at: espera }
  - say: Cada semana repetimos el mismo ciclo. Primero planeamos lo que sigue, luego lo construimos con calma, lo entregamos a dymmsa, y escuchamos su feedback. Y volvemos a empezar.
    flow:
      shape: cycle
      title: Entrega semanal
      loop: volvemos
      steps:
        - { text: Planear, at: planeamos }
        - { text: Construir, at: construimos }
        - { text: Entregar, at: entregamos }
        - { text: Escuchar feedback, at: escuchamos }
  - say: Cada quien tiene su parte. El huésped elige su mesa, el venue aprueba la reserva, el huésped paga el depósito, y el host prepara la mesa para recibirlo.
    flow:
      shape: lanes
      title: ¿Quién hace qué?
      lanes: [Huésped, Venue, Host]
      steps:
        - { text: Elige su mesa, lane: Huésped, at: elige }
        - { text: Aprueba la reserva, lane: Venue, at: aprueba }
        - { text: Paga el depósito, lane: Huésped, at: paga }
        - { text: Prepara la mesa, lane: Host, at: prepara }
  - say: Antes, reservar tomaba cuatro pasos. Llamar al venue, esperar su respuesta, mandar una transferencia, y enviar el comprobante. Ahora son dos. Se reserva en línea, y se paga con tarjeta.
    flow:
      shape: compare
      title: Reservar una mesa
      before:
        label: Antes
        steps:
          - { text: Llamar al venue, at: llamar }
          - { text: Esperar respuesta, at: esperar }
          - { text: Mandar transferencia, at: transferencia }
          - { text: Enviar comprobante, at: comprobante }
      after:
        label: Ahora
        steps:
          - { text: Reservar en línea, at: línea }
          - { text: Pagar con tarjeta, at: tarjeta }
