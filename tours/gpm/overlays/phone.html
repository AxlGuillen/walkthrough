<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The device card's right side: the portal on a phone (assets/phone.mp4, from phone.yaml) in
     the room the aside-left shot leaves, under the card's one line of text.
     params: title. beats: title (the text), phone (the phone comes in). -->
<link rel="stylesheet" href="../../../templates/overlays/base.css">
<style>
  body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; font-family: var(--display, var(--font)); }
  .room { position: absolute; left: 64%; top: 8%; width: 32%; height: 84%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3.2vmin; }
  .title { font-size: 4.2vmin; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); text-align: center; }
  .phone { position: relative; height: 66vh; aspect-ratio: 9 / 19.5; border-radius: 5.4vmin; background: #111; padding: 1.1vmin;
    box-shadow: 0 3vmin 7vmin rgba(0, 0, 0, 0.28), inset 0 0 0 0.25vmin #3a3a3a; }
  .phone video { width: 100%; height: 100%; border-radius: 4.4vmin; object-fit: cover; display: block; background: #fff; }
  .island { position: absolute; top: 2.2vmin; left: 50%; translate: -50% 0; width: 26%; height: 2.6vmin; border-radius: 2vmin; background: #000; }
</style>
</head>
<body>
<div class="room">
  <div class="title" data-param="title"></div>
  <div class="phone"><video muted playsinline preload="auto"></video><div class="island"></div></div>
</div>
<script src="../../../templates/overlays/params.js"></script>
<script src="../../../templates/overlays/vendor/gsap/gsap.min.js"></script>
<script src="../../../templates/overlays/kit.js"></script>
<script>
  document.querySelector('video').src = asset('assets/phone.mp4');
  const tl = kit.timeline();
  tl.fromTo('.title', { opacity: 0, y: '0.5em' }, { opacity: 1, y: 0 }, kit.beat('title', 0.2));
  tl.fromTo('.phone', { opacity: 0, y: '6vh', scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.8 }, kit.beat('phone', 0.6));
</script>
</body>
</html>
