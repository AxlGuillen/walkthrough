<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- A phone playing a clip (rendered from a phone-*.yaml tour) in the room an aside-left shot
     leaves, under one line of text. params: title, clip, and clip2 to fade to on the `swap`
     beat. beats: title, phone, swap. -->
<link rel="stylesheet" href="../../../templates/overlays/base.css">
<style>
  body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; font-family: var(--display, var(--font)); }
  /* room('aside-left') on 16:9: the screen ends at 63% of the width, the free part runs
     from 65.8% to 96.6%; the phone keeps to its middle, well clear of the screen's edge. */
  .room { position: absolute; left: 65.8%; width: 30.8%; top: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vmin; }
  .title { font-size: 3.8vmin; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); text-align: center; text-wrap: balance; }
  .phone { position: relative; height: 72vh; aspect-ratio: 9 / 19.5; border-radius: 5.6vmin; background: #111; padding: 1.2vmin;
    box-sizing: border-box; box-shadow: 0 3vmin 7vmin rgba(0, 0, 0, 0.28), inset 0 0 0 0.25vmin #3a3a3a; }
  /* The clip is 9:16; the bands above and below hold the island and the home bar, so the
     whole recording shows, uncropped and clear of the bezel. */
  .screen { height: 100%; border-radius: 4.4vmin; overflow: hidden; background: #fff; display: flex; flex-direction: column; }
  .status { flex: 1.3; display: grid; place-items: center; }
  .island { width: 30%; height: 2.6vmin; border-radius: 2vmin; background: #000; }
  .screen video { width: 100%; aspect-ratio: 9 / 16; display: block; background: #fff; }
  .clips { position: relative; }
  .clips video + video { position: absolute; inset: 0; opacity: 0; }
  .home { flex: 1; display: grid; place-items: center; }
  .home::after { content: ''; width: 36%; height: 0.55vmin; border-radius: 1vmin; background: #111; }
</style>
</head>
<body>
<div class="room">
  <div class="title" data-param="title"></div>
  <div class="phone"><div class="screen"><div class="status"><div class="island"></div></div><div class="clips"><video muted playsinline preload="auto"></video></div><div class="home"></div></div></div>
</div>
<script src="../../../templates/overlays/params.js"></script>
<script src="../../../templates/overlays/vendor/gsap/gsap.min.js"></script>
<script src="../../../templates/overlays/kit.js"></script>
<script>
  document.querySelector('video').src = asset(param('clip'));
  const tl = kit.timeline();
  if (param('clip2')) {
    const second = document.createElement('video');
    Object.assign(second, { muted: true, playsInline: true, preload: 'auto', src: asset(param('clip2')) });
    document.querySelector('.clips').append(second);
    tl.to(second, { opacity: 1, duration: 0.5, ease: 'none' }, kit.beat('swap', 6));
  }
  tl.fromTo('.title', { opacity: 0, y: '0.5em' }, { opacity: 1, y: 0 }, kit.beat('title', 0.2));
  walkthrough.cue(kit.beat('title', 0.2));
  tl.fromTo('.phone', { opacity: 0, y: '6vh', scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.8 }, kit.beat('phone', 0.6));
</script>
</body>
</html>
