    do:
      - goto: /g/fbsdemo/FKOPZWIYXBOFKURAA
      - wait: 'h2:has-text("Reserve an experience")'
  - hold: 5
    do:
      - scroll: { to: 'h2:has-text("Experiences for every stay")', at: 0, duration: 3.5 }
